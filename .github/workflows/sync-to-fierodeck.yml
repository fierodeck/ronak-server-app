name: Sync Django Backend to fierodeck

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    name: Sync to fierodeck/ronak-server-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to fierodeck/ronak-server-app
        env:
          TARGET_PAT: ${{ secrets.FIERODECK_PAT }}
        run: |
          if [ -z "$TARGET_PAT" ]; then
            echo "::error::Secret FIERODECK_PAT is missing in GitHub repository settings!"
            exit 1
          fi

          # Unset host credential extraheader so target PAT is used
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create a deploy branch for fierodeck without workflow files
          git checkout -b deploy-sync
          if [ -d ".github" ]; then
            git rm -rf .github/
            git commit -m "deploy: sync from ayazpatel/ronak-server-app [skip ci]" || true
          fi

          git remote add target https://x-access-token:${TARGET_PAT}@github.com/fierodeck/ronak-server-app.git
          git push --force target deploy-sync:main
          echo "Successfully synced main branch to fierodeck/ronak-server-app!"
